<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Global26 · 프로그램 관리</title>
<style>
:root{font-family:system-ui,-apple-system,'맑은 고딕',sans-serif;color:#242630;background:#f5f6f8;--brand:#872740}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #ddd;border-radius:9px;padding:10px 16px;background:white;color:inherit}button.primary{background:var(--brand);color:white;border-color:var(--brand)}button:disabled{opacity:.5;cursor:wait}input,select,textarea{width:100%;border:1px solid #d9dce3;border-radius:8px;padding:11px;background:white}label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}h1,h2,p{margin-top:0}small,.muted{color:#727684}.auth{max-width:440px;margin:10vh auto;padding:34px;background:white;border:1px solid #e5e6ea;border-radius:18px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--brand);margin-bottom:16px}.auth h1{font-size:27px}.auth form{display:grid;gap:17px}.auth footer{margin-top:24px;font-size:12px;color:#747884;line-height:1.7}.message{white-space:pre-wrap;line-height:1.6;color:#872740;margin:14px 0}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#251e27;color:#eee;padding:32px 22px}aside h2{font-size:25px;margin-bottom:6px}aside small{color:#baacb6}nav{display:grid;gap:9px;margin-top:40px}nav button{text-align:left;background:transparent;color:#cdc4cd;border:0;padding:14px}nav button.active{background:#872740;color:white}.side-note{margin-top:40px;font-size:12px;color:#b8adb9;line-height:1.8}main{padding:38px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:32px}.top h1{font-size:27px;margin-bottom:8px}.account{display:flex;align-items:center;gap:12px;font-size:12px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}.card,.panel{background:white;border:1px solid #e6e7eb;border-radius:14px;padding:24px}.card small{display:block;margin-bottom:15px}.card strong{font-size:29px;letter-spacing:-1px}.card .unit{font-size:14px}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:20px}.toolbar input{max-width:360px}.toolbar select{max-width:150px}.toolbar button{white-space:nowrap}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:14px}th{font-size:12px;color:#6b7080;background:#f8f9fb;white-space:nowrap}td,th{padding:16px 12px;border-bottom:1px solid #eceef2}td{min-width:100px}td.name{min-width:230px;font-weight:650}.badge{display:inline-block;padding:5px 9px;border-radius:7px;font-size:12px;background:#f4f4f6;white-space:nowrap}.완료{background:#e7f4ed;color:#20784a}.진행중{background:#eaf1ff;color:#3463ac}.협의중,.준비중{background:#fff2e4;color:#9f651f}.보류{background:#fff8d9;color:#877128}.미착수{background:#fff0f0;color:#ac5a5a}.empty{text-align:center;padding:55px 15px;color:#787e89}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.section-title h2{font-size:18px;margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}dialog{border:0;border-radius:16px;width:min(660px,94vw);max-height:88vh;padding:28px;box-shadow:0 25px 100px #0003}dialog::backdrop{background:#17132088}dialog form{display:grid;gap:16px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}textarea{min-height:90px;resize:vertical}.danger{color:#b32437}.hidden,[hidden]{display:none!important}.loading{padding:50px;text-align:center}@media(max-width:850px){.shell{grid-template-columns:1fr}aside{padding:20px}aside h2{font-size:20px}nav{display:flex;margin-top:18px;gap:4px;flex-wrap:wrap}nav button{padding:10px}.side-note{display:none}main{padding:20px}.cards{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}.toolbar{flex-wrap:wrap}.grid{grid-template-columns:1fr}}@media(max-width:480px){.auth{margin:25px 12px;padding:25px}.card{padding:18px}.card strong{font-size:23px}.panel{padding:16px}}
</style></head><body>
<section id="auth" class="auth"><div class="eyebrow">AROUND X · 2026</div><h1>글로벌 프로그램 관리</h1><p class="muted">프로그램과 참여기업의 현황을 한곳에서.</p><form id="authForm"><div><label for="email">이메일</label><input id="email" type="email" autocomplete="username" required placeholder="이메일 주소"></div><div><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" minlength="8" required placeholder="8자 이상"></div><button id="login" class="primary" type="submit">로그인</button><button id="signup" type="button">회원가입</button></form><div id="authMessage" class="message" role="status"></div><footer>가입한 회원은 현황을 조회할 수 있습니다.<br>데이터 추가·수정·삭제는 관리자만 가능합니다.</footer></section>
<div id="app" class="shell" hidden><aside><div class="eyebrow" style="color:#df9eb2">KOREA UNIVERSITY</div><h2>Global26<span style="color:#d988a0">.</span></h2><small>글로벌 기업 협업 프로그램</small><nav><button data-tab="dashboard" class="active">◈ 대시보드</button><button data-tab="programs">▤ 프로그램 관리</button><button data-tab="companies">▦ 참여기업 현황</button></nav><div class="side-note">2026 AROUND X<br>고려대학교 세종창업지원센터<br><br>저장한 변경사항은 회원들에게<br>동일하게 표시됩니다.</div></aside><main><header class="top"><div><div class="eyebrow">WORKSPACE / 2026</div><h1 id="pageTitle">운영 대시보드</h1><p class="muted" id="subtitle">프로그램의 진행 상황을 확인하세요.</p></div><div class="account"><span id="who"></span><button id="refresh">새로고침</button><button id="logout">로그아웃</button></div></header><div id="notice" class="message" role="status"></div><section id="metrics" class="cards"></section><section class="panel"><div class="section-title"><h2 id="tableTitle">프로그램 현황</h2><button id="add" class="primary" hidden>+ 추가하기</button></div><div class="toolbar"><input id="search" aria-label="검색" placeholder="프로그램, 기업, 담당자 검색"><select id="filter" aria-label="진행 상태"><option value="">모든 상태</option><option>미착수</option><option>준비중</option><option>협의중</option><option>진행중</option><option>완료</option><option>보류</option></select></div><div id="content" class="table-wrap"></div></section></main></div>
<dialog id="editor"><form id="editForm"><h2 id="editTitle">정보 수정</h2><div id="fields" class="grid"></div><div id="editMessage" class="message" role="status"></div><div class="actions"><button id="delete" type="button" class="danger">삭제</button><button id="cancel" type="button">취소</button><button id="save" class="primary" type="submit">저장</button></div></form></dialog>
<script>
'use strict';
const URL='https://xmgritymhaifkoixgpoy.supabase.co', KEY='sb_publishable_pqN2CqrkM4NPMHB2ZPEecg_MKrmi0uK', ADMIN='hyemang9@naver.com';
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let session=null, data={programs:[],companies:[]}, tab='dashboard', editing=null, refreshPromise=null;
const schemas={programs:[['program_name','프로그램명','text',true],['category','분류'],['partner','협력기관'],['vendor','운영사'],['schedule_text','일정'],['owner','담당자'],['status','진행 상태','status'],['budget_base','본예산 (원)','number'],['budget_extra','추경예산 (원)','number'],['kpi_goal','목표 기업 수','number'],['kpi_demand','수요 기업 수','number'],['actual','실적 기업 수','number'],['tasks','업무 메모','textarea'],['report','보고사항','textarea']],companies:[['company_name','기업명','text',true],['program_group','프로그램 그룹'],['stage','단계'],['participation','참여 프로그램'],['item','아이템','textarea'],['tech','주요 기술','textarea']]};
const isAdmin=()=>session?.user?.email?.toLowerCase()===ADMIN;
function persist(s){session=s;if(s)sessionStorage.setItem('global26-session',JSON.stringify(s));else sessionStorage.removeItem('global26-session')}
async function request(path,{method='GET',body,token,prefer}={}){const headers={apikey:KEY,'Content-Type':'application/json'};if(token)headers.Authorization='Bearer '+token;if(prefer)headers.Prefer=prefer;const r=await fetch(URL+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body)});const text=await r.text();let result;try{result=text?JSON.parse(text):null}catch{result=null}if(!r.ok){const e=new Error(result?.msg||result?.message||result?.error_description||'요청 실패 ('+r.status+')');e.status=r.status;throw e}return result}
async function token(){if(!session)throw Error('로그인이 필요합니다.');if((session.expires_at||0)*1000<Date.now()+60000){if(!refreshPromise)refreshPromise=request('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:session.refresh_token}}).then(s=>{s.expires_at=Math.floor(Date.now()/1000)+s.expires_in;persist(s)}).catch(e=>{persist(null);showAuth();throw e}).finally(()=>refreshPromise=null);await refreshPromise}return session.access_token}
async function db(table,opts={}){return request('/rest/v1/'+table,{...opts,token:await token()})}
function friendly(e){if(/Invalid login credentials/i.test(e.message))return '이메일 또는 비밀번호를 확인해 주세요.';if(/Email not confirmed/i.test(e.message))return '이메일함에서 가입 확인 링크를 먼저 눌러 주세요.';if(/fetch/i.test(e.message))return '서버에 연결하지 못했습니다. 인터넷 연결을 확인해 주세요.';return e.message}
function showAuth(){data={programs:[],companies:[]};$('app').hidden=true;$('auth').hidden=false;$('content').replaceChildren();$('password').value='';if($('editor').open)$('editor').close()}
async function authenticate(signup=false){if(!$('authForm').reportValidity())return;$('login').disabled=$('signup').disabled=true;$('authMessage').textContent='처리 중…';try{const credentials={email:$('email').value.trim(),password:$('password').value};const s=await request(signup?'/auth/v1/signup':'/auth/v1/token?grant_type=password',{method:'POST',body:credentials});if(s.access_token){s.expires_at=Math.floor(Date.now()/1000)+s.expires_in;persist(s);$('password').value='';$('authMessage').textContent='';await load()}else $('authMessage').textContent='가입 요청을 접수했습니다. 이메일함의 확인 링크를 누른 뒤 로그인해 주세요.'}catch(e){$('authMessage').textContent=friendly(e)}finally{$('login').disabled=$('signup').disabled=false}}
async function load(){$('auth').hidden=true;$('app').hidden=false;$('who').textContent=(session.user?.email||'')+' · '+(isAdmin()?'관리자':'조회 회원');$('notice').textContent='데이터를 불러오는 중…';$('refresh').disabled=true;try{async function all(table){let rows=[],offset=0;while(true){const page=await db(table+'?select=*&order=sort_order.asc,id.asc&limit=1000&offset='+offset);rows.push(...page);if(page.length<1000)return rows;offset+=1000}}const [programs,companies]=await Promise.all([all('programs'),all('companies')]);data={programs,companies};$('notice').textContent='';render()}catch(e){$('notice').textContent='불러오지 못했습니다: '+friendly(e)}finally{$('refresh').disabled=false}}
function render(){const p=data.programs,total=p.reduce((s,r)=>s+Number(r.budget_base||0)+Number(r.budget_extra||0),0);$('metrics').innerHTML=[['운영 항목',p.length,'건'],['진행 중',p.filter(r=>String(r.status).replaceAll(' ','')==='진행중').length,'건'],['참여기업',new Set(data.companies.map(r=>r.company_name)).size,'개사'],['총 편성예산',new Intl.NumberFormat('ko-KR',{maximumFractionDigits:1}).format(total/10000),'만원']].map(([l,n,u])=>'<div class="card"><small>'+l+'</small><strong>'+n+'</strong> <span class="unit">'+u+'</span></div>').join('');$('pageTitle').textContent={dashboard:'운영 대시보드',programs:'프로그램 관리',companies:'참여기업 현황'}[tab];$('subtitle').textContent=tab==='companies'?'기업별 참여 프로그램과 기술 정보를 확인하세요.':'프로그램별 예산·일정·진행 상태를 확인하세요.';$('tableTitle').textContent=tab==='companies'?'참여기업 목록':'프로그램 현황';$('filter').hidden=tab==='companies';$('add').hidden=!isAdmin();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));renderTable()}
function renderTable(){const type=tab==='companies'?'companies':'programs',q=$('search').value.trim().toLowerCase(),status=$('filter').value;const rows=data[type].filter(r=>Object.values(r).some(v=>String(v??'').toLowerCase().includes(q))&&(type==='companies'||!status||String(r.status).replaceAll(' ','')===status));if(!rows.length){$('content').innerHTML='<div class="empty">'+(data[type].length?'검색 결과가 없습니다.':'아직 등록된 데이터가 없습니다. 관리자 계정에서 추가할 수 있습니다.')+'</div>';return}const cols=type==='programs'?[['program_name','프로그램'],['partner','협력기관'],['schedule_text','일정'],['owner','담당자'],['status','상태'],['budget','예산'],['tasks','업무 메모']]:[['company_name','기업명'],['stage','단계'],['participation','참여 프로그램'],['item','아이템'],['tech','주요 기술']];$('content').innerHTML='<table><thead><tr>'+cols.map(c=>'<th>'+c[1]+'</th>').join('')+(isAdmin()?'<th>관리</th>':'')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(([k],i)=>'<td class="'+(i===0?'name':'')+'">'+(k==='status'?'<span class="badge '+esc(String(r[k]||'').replaceAll(' ',''))+'">'+esc(r[k]||'미착수')+'</span>':k==='budget'?esc(Number(r.budget_base||0)+Number(r.budget_extra||0)).replace(/\B(?=(\d{3})+(?!\d))/g,',')+'원':esc(r[k]||'—'))+'</td>').join('')+(isAdmin()?'<td><button data-edit="'+r.id+'">수정</button></td>':'')+'</tr>').join('')+'</tbody></table>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(type,data[type].find(r=>String(r.id)===b.dataset.edit)))}
function openEdit(type,row=null){if(!isAdmin())return;editing={type,row};$('editTitle').textContent=(type==='programs'?'프로그램':'참여기업')+(row?' 수정':' 추가');$('editMessage').textContent='';$('delete').hidden=!row;$('fields').innerHTML=schemas[type].map(([key,label,kind='text',required=false])=>{const value=esc(row?.[key]??(kind==='number'?'':key==='status'?'미착수':''));let input=kind==='textarea'?'<textarea id="f_'+key+'">'+value+'</textarea>':kind==='status'?'<select id="f_'+key+'">'+['미착수','준비중','협의중','진행중','완료','보류'].map(s=>'<option '+(s===String(row?.[key]||'미착수').replaceAll(' ','')?'selected':'')+'>'+s+'</option>').join('')+'</select>':'<input id="f_'+key+'" type="'+kind+'" value="'+value+'" '+(required?'required':'')+(kind==='number'?' min="0" step="1"':'')+'>';return '<div><label for="f_'+key+'">'+label+(required?' *':'')+'</label>'+input+'</div>'}).join('');$('editor').showModal()}
async function save(e){e.preventDefault();if(!isAdmin()||!editing)return;const {type,row}=editing,payload={};for(const [key,,kind]of schemas[type]){const v=$('f_'+key).value.trim();payload[key]=kind==='number'?(v===''?null:Number(v)):v}payload.updated_at=new Date().toISOString();$('save').disabled=true;$('editMessage').textContent='저장 중…';try{const result=await db(type+(row?'?id=eq.'+row.id:''),{method:row?'PATCH':'POST',body:payload,prefer:'return=representation'});if(!result?.length)throw Error('수정 권한이 없거나 항목이 삭제되었습니다.');$('editor').close();await load()}catch(e){$('editMessage').textContent=friendly(e)}finally{$('save').disabled=false}}
$('authForm').onsubmit=e=>{e.preventDefault();authenticate()};$('signup').onclick=()=>authenticate(true);$('refresh').onclick=load;$('logout').onclick=async()=>{const old=session;persist(null);showAuth();try{await request('/auth/v1/logout',{method:'POST',token:old?.access_token})}catch{}};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;$('search').value='';$('filter').value='';render()});$('search').oninput=renderTable;$('filter').onchange=renderTable;$('add').onclick=()=>openEdit(tab==='companies'?'companies':'programs');$('cancel').onclick=()=>$('editor').close();$('editForm').onsubmit=save;$('delete').onclick=async()=>{if(!isAdmin()||!editing?.row||!confirm('이 항목을 영구 삭제할까요? 되돌릴 수 없습니다.'))return;$('delete').disabled=true;try{const result=await db(editing.type+'?id=eq.'+editing.row.id,{method:'DELETE',prefer:'return=representation'});if(!result?.length)throw Error('삭제 권한이 없거나 항목이 이미 삭제되었습니다.');$('editor').close();await load()}catch(e){$('editMessage').textContent=friendly(e)}finally{$('delete').disabled=false}};
try{const stored=JSON.parse(sessionStorage.getItem('global26-session'));if(stored?.access_token){session=stored;load()}}catch{persist(null)}
</script></body></html>
